[project]
name = "hisob-ai-backend"
version = "0.1.0"
description = "Hisob AI backend (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "uuid6>=2024.7.10",
    "boto3>=1.43.111",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "dramatiq[redis]>=2.2.1",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "boto3-stubs[s3]>=1.43.111",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20", "RUF"]
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "S603"]
"migrations/**" = ["S608"]
"scripts/**" = ["T201", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["uuid6", "uuid6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker"]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.importlinter]
root_packages = ["app"]

# Слои сверху вниз: верхний может импортировать нижний, обратное запрещено.
[[tool.importlinter.contracts]]
name = "Module layering"
type = "layers"
layers = [
    "app.modules.copilot",
    "app.modules.accounting | app.modules.bank | app.modules.integrations",
    "app.modules.inventory",
    "app.modules.documents",
    "app.modules.catalog",
    "app.modules.tenancy",
    "app.modules.rbac",
    "app.modules.identity",
    "app.modules.audit",
    "app.platform",
]
# Постановка задачи в очередь: documents -> app.worker (отложенный импорт). Воркер — корень композиции и
# через app.registry импортирует модели всех модулей (нужны для внешних ключей); это не зависимость логики.
ignore_imports = ["app.modules.documents.extraction.service -> app.worker"]

[[tool.importlinter.contracts]]
name = "Platform does not know about modules"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = ["app.modules"]
