# Hisob AI — локальная/серверная среда разработки.
# Порты публикуются только на 127.0.0.1. Файлы документов хранятся в сервисе storage (S3 API).
# Redis — очередь фоновых задач распознавания (не источник финансовой истины). Ключи AI — только у worker.
name: hisob

x-backend-env: &backend-env
  ENV: dev
  DATABASE_URL: postgresql+psycopg://hisob_app:${APP_DB_PASSWORD}@postgres:5432/hisob
  MIGRATION_DATABASE_URL: postgresql+psycopg://hisob_migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/hisob
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  S3_ENDPOINT_URL: http://storage:8333
  S3_BUCKET: hisob-documents
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY в .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY в .env}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hisob_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: hisob
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisob_admin -d hisob"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-совместимое хранилище файлов документов (MinIO больше не публикует образы).
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY в .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY в .env}
    volumes:
      - storage-data:/data

  # Брокер очереди распознавания. Данные не критичны: источник истины о задачах — PostgreSQL (таблица ai_job).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # Воркер фоновых задач: единственный контейнер с ключами AI-провайдеров.
  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
    command: ["dramatiq", "app.worker", "--processes", "1", "--threads", "2", "--queues", "extraction"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      storage:
        condition: service_started

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8300}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3300}:3000"
    depends_on:
      - backend

  # --- профиль test: docker compose --profile test run --rm backend-tests ---
  backend-tests:
    profiles: ["test"]
    build: ./backend
    environment:
      <<: *backend-env
      TEST_POSTGRES_HOST: postgres
      TEST_ADMIN_URL: postgresql+psycopg://hisob_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/postgres
      TEST_MIGRATOR_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      TEST_APP_PASSWORD: ${APP_DB_PASSWORD}
      COOKIE_SECURE: "false"
    command: ["pytest", "-ra"]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started

  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    working_dir: /e2e
    volumes:
      - ./test/e2e:/e2e
    environment:
      BASE_URL: http://frontend:3000
      CI: "1"
    command: ["sh", "-c", "npm ci && npx playwright test"]
    depends_on:
      - frontend

volumes:
  pgdata:
  storage-data:
  redis-data:
